[project]
name = "sharebucks-backend"
version = "0.1.0"
description = "A FastAPI mock backend for the ShareBucks OpenAPI contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
pythonpath = ["."]
