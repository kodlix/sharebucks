openapi: 3.2.0
info:
  title: ShareBucks API
  version: 1.0.0
  description: |
    ShareBucks is a full-stack expense-sharing application for groups such as trips,
    dinners, roommates, families, clubs, and events.

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - cookieAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
        "422":
          description: Validation error

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Incorrect email or password

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset token for an existing email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Password reset instructions response
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                  reset_token:
                    type: string
                    nullable: true

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset succeeded
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current logged-in user
      responses:
        "200":
          description: Current logged-in user or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - type: "null"

  /api/groups:
    get:
      tags: [Groups]
      summary: List groups that the current user belongs to
      responses:
        "200":
          description: Group summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Authentication required
    post:
      tags: [Groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "200":
          description: Created group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          description: Authentication required
        "422":
          description: Validation error

  /api/groups/{group_id}:
    get:
      tags: [Groups]
      summary: Fetch group detail by id
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Not an active member
        "404":
          description: Group not found
    patch:
      tags: [Groups]
      summary: Update a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupInput"
      responses:
        "200":
          description: Updated group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Only admin may edit
        "409":
          description: Archived group cannot be edited
        "422":
          description: Validation error

  /api/groups/{group_id}/archive:
    post:
      tags: [Groups]
      summary: Archive a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Archived group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Only admin may archive

  /api/groups/{group_id}/leave:
    post:
      tags: [Groups]
      summary: Leave a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Left group
        "409":
          description: Admin cannot leave; settle debt first

  /api/groups/{group_id}/members:
    get:
      tags: [Groups]
      summary: List group members
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Members of the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"

  /api/groups/{group_id}/invites:
    post:
      tags: [Groups]
      summary: Create an invite code for a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Created invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvite"
        "409":
          description: Archived groups accept no new members

  /api/groups/{group_id}/join:
    post:
      tags: [Groups]
      summary: Join a public group or a private group via invite code
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Optional invitation code for a private group
      responses:
        "200":
          description: Joined group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Private group requires invitation code
        "409":
          description: Already a member or archived group

  /api/groups/{group_id}/members/{user_id}:
    delete:
      tags: [Groups]
      summary: Remove an active member from a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed
        "403":
          description: Admin-only action
        "404":
          description: Member not found

  /api/groups/discover:
    get:
      tags: [Groups]
      summary: Discover public groups
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Optional search term
      responses:
        "200":
          description: Public discover groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverGroup"

  /api/groups/{group_id}/categories:
    post:
      tags: [Groups]
      summary: Create a custom category for a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: Duplicate category name
        "422":
          description: Empty category name

  /api/groups/{group_id}/expenses:
    get:
      tags: [Expenses]
      summary: List expenses in a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      tags: [Expenses]
      summary: Create an expense
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "409":
          description: Archived group cannot accept expenses
        "422":
          description: Validation error

  /api/groups/{group_id}/expenses/{expense_id}:
    get:
      tags: [Expenses]
      summary: Fetch one expense
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Expense not found
    patch:
      tags: [Expenses]
      summary: Update an expense
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "403":
          description: Only creator can edit
        "409":
          description: Archived group cannot be changed
        "422":
          description: Validation error
    delete:
      tags: [Expenses]
      summary: Delete an expense
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: Expense deleted
        "403":
          description: Only creator can delete
        "409":
          description: Archived group cannot be changed

  /api/groups/{group_id}/balances:
    get:
      tags: [Balances]
      summary: Fetch member balances for a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Member balance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberBalance"

  /api/groups/{group_id}/settlements/suggestions:
    get:
      tags: [Settlements]
      summary: Suggest settlement transfers
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Settlement suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettlementSuggestion"

  /api/groups/{group_id}/settlements:
    get:
      tags: [Settlements]
      summary: List recorded settlements for a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Recorded settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"
    post:
      tags: [Settlements]
      summary: Record a settlement between members
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementInput"
      responses:
        "200":
          description: Created settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "409":
          description: Archived group cannot record settlements
        "422":
          description: Validation or rule error

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Fetch dashboard summary for the authenticated user
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    GroupId:
      in: path
      name: group_id
      required: true
      schema:
        type: string
      description: Group ID
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: string
      description: User ID
    ExpenseId:
      in: path
      name: expense_id
      required: true
      schema:
        type: string
      description: Expense ID

  schemas:
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time

    Group:
      type: object
      required:
        [
          id,
          name,
          description,
          visibility,
          currency,
          created_by,
          is_archived,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [private, public]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        created_by:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupMember:
      type: object
      required: [id, group_id, user_id, role, status, joined_at, left_at, user]
      properties:
        id:
          type: string
        group_id:
          type: string
        user_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, inactive]
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: "#/components/schemas/User"

    GroupInvite:
      type: object
      required: [id, group_id, created_by, code, expires_at, created_at]
      properties:
        id:
          type: string
        group_id:
          type: string
        created_by:
          type: string
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, group_id, name, is_default, created_at]
      properties:
        id:
          type: string
        group_id:
          type: string
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    ExpenseShare:
      type: object
      required: [id, expense_id, user_id, amount]
      properties:
        id:
          type: string
        expense_id:
          type: string
        user_id:
          type: string
        amount:
          type: integer
          description: Monetary amount in minor units

    Expense:
      type: object
      required:
        [
          id,
          group_id,
          created_by,
          payer_id,
          category_id,
          title,
          amount,
          expense_date,
          notes,
          created_at,
          updated_at,
          shares,
          payer,
          category,
        ]
      properties:
        id:
          type: string
        group_id:
          type: string
        created_by:
          type: string
        payer_id:
          type: string
        category_id:
          type: string
        title:
          type: string
        amount:
          type: integer
        expense_date:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseShare"
        payer:
          $ref: "#/components/schemas/User"
        category:
          $ref: "#/components/schemas/Category"

    Settlement:
      type: object
      required:
        [
          id,
          group_id,
          payer_id,
          recipient_id,
          amount,
          settlement_date,
          note,
          created_at,
          payer,
          recipient,
        ]
      properties:
        id:
          type: string
        group_id:
          type: string
        payer_id:
          type: string
        recipient_id:
          type: string
        amount:
          type: integer
        settlement_date:
          type: string
          format: date
        note:
          type: string
        created_at:
          type: string
          format: date-time
        payer:
          $ref: "#/components/schemas/User"
        recipient:
          $ref: "#/components/schemas/User"

    MemberBalance:
      type: object
      required: [user_id, user, status, paid, owed, net]
      properties:
        user_id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        status:
          type: string
          enum: [active, inactive]
        paid:
          type: integer
        owed:
          type: integer
        net:
          type: integer

    SettlementSuggestion:
      type: object
      required: [payer_id, recipient_id, payer, recipient, amount]
      properties:
        payer_id:
          type: string
        recipient_id:
          type: string
        payer:
          $ref: "#/components/schemas/User"
        recipient:
          $ref: "#/components/schemas/User"
        amount:
          type: integer

    GroupSummary:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [role, member_count, my_balance, total_spent]
          properties:
            role:
              type: string
              enum: [admin, member]
            member_count:
              type: integer
            my_balance:
              type: integer
            total_spent:
              type: integer

    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [role, members, categories]
          properties:
            role:
              type: string
              enum: [admin, member]
            members:
              type: array
              items:
                $ref: "#/components/schemas/GroupMember"
            categories:
              type: array
              items:
                $ref: "#/components/schemas/Category"

    DiscoverGroup:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [member_count, is_member]
          properties:
            member_count:
              type: integer
            is_member:
              type: boolean

    DashboardData:
      type: object
      required: [groups, totals, recent_expenses, recent_settlements, spending]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        totals:
          type: object
          required: [owed, receivable, net, outstanding_settlements]
          properties:
            owed:
              type: integer
            receivable:
              type: integer
            net:
              type: integer
            outstanding_settlements:
              type: integer
        recent_expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        recent_settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
        spending:
          type: object
          required: [total, this_month, last_month, by_category, by_month]
          properties:
            total:
              type: integer
            this_month:
              type: integer
            last_month:
              type: integer
            by_category:
              type: array
              items:
                type: object
                required: [name, amount]
                properties:
                  name:
                    type: string
                  amount:
                    type: integer
            by_month:
              type: array
              items:
                type: object
                required: [month, amount]
                properties:
                  month:
                    type: string
                    format: month
                  amount:
                    type: integer

    RegisterInput:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        display_name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password

    CreateGroupInput:
      type: object
      required: [name, description, visibility, currency]
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [private, public]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    UpdateGroupInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [private, public]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    ExpenseInput:
      type: object
      required:
        [title, amount, category_id, payer_id, expense_date, notes, shares]
      properties:
        title:
          type: string
        amount:
          type: integer
        category_id:
          type: string
        payer_id:
          type: string
        expense_date:
          type: string
          format: date
        notes:
          type: string
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareInput"

    ShareInput:
      type: object
      required: [user_id, amount]
      properties:
        user_id:
          type: string
        amount:
          type: integer

    SettlementInput:
      type: object
      required: [payer_id, recipient_id, amount, settlement_date, note]
      properties:
        payer_id:
          type: string
        recipient_id:
          type: string
        amount:
          type: integer
        settlement_date:
          type: string
          format: date
        note:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status]
          properties:
            message:
              type: string
            status:
              type: integer
